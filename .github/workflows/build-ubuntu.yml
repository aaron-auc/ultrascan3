name: Build — Ubuntu

run-name: >-
  ${{ github.event_name == 'workflow_call'
    && format('Ubuntu 24.04 [{0}]', inputs.ref)
    || format('Manual Ubuntu 24.04 by @{0}', github.actor) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA"
        required: false
        default: main
        type: string
      clean_tier:
        description: "Clean tier"
        required: false
        default: incremental
        type: choice
        options: [incremental, rebuild, clean, clean-purge-cache]
      artifact_retention_days:
        description: "Artifact retention (days)"
        required: false
        default: "3"
        type: choice
        options: ["3", "7", "14", "30"]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: main
      clean_tier:
        required: false
        type: string
        default: incremental
      artifact_name_prefix:
        required: false
        type: string
        default: ""
      artifact_retention_days:
        required: false
        type: number
        default: 3

permissions:
  contents: read
  packages: write

jobs:
  build-app:
    name: "Ubuntu APP (x86_64, qt6)"
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@4527e9100e28ba09fa24b5d3ccebed6850fee20f
    with:
      ref: ${{ inputs.ref || 'main' }}
      runner: ubuntu-24.04
      qt_variant: qt6
      profile: APP
      clean_tier: ${{ inputs.clean_tier || 'incremental' }}
      artifact_name_prefix: ${{ inputs.artifact_name_prefix || format('nightly-ubuntu-{0}', github.run_id) }}
      artifact_platform_label: Ubuntu-24.04-x86_64
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days || '3') }}

  build-hpc:
    name: "Ubuntu HPC (x86_64, qt6)"
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@4527e9100e28ba09fa24b5d3ccebed6850fee20f
    with:
      ref: ${{ inputs.ref || 'main' }}
      runner: ubuntu-24.04
      qt_variant: qt6
      profile: HPC
      clean_tier: ${{ inputs.clean_tier || 'incremental' }}
      artifact_name_prefix: ${{ format('{0}-HPC', inputs.artifact_name_prefix || format('nightly-ubuntu-{0}', github.run_id)) }}
      artifact_platform_label: Ubuntu-24.04-x86_64
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days || '3') }}
