name: UltraScan3 Nightly Build

run-name: >-
  ${{ github.event_name == 'schedule'
    && format('Nightly [main] {0}', github.run_started_at)
    || format('Nightly [manual] by @{0}', github.actor) }}

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  # =========================================================================
  # PHASE 0 — CHANGE DETECTION
  # Scheduled runs skip everything if no commits landed on main in 24h.
  # workflow_dispatch always proceeds.
  # =========================================================================

  check-changes:
    name: "Check for changes in last 24h"
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Detect commits in last 24 hours
        id: detect
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git log --oneline --since="24 hours ago" origin/main | wc -l | tr -d ' ')
          echo "Commits in last 24h: $COUNT"
          echo "has_changes=$( [[ $COUNT -gt 0 ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"

  # =========================================================================
  # PHASE 1 — CACHE PROBES
  # Exact-key lookup (no download) for each platform/profile.
  # A miss triggers Phase 2 warm for all platforms.
  # Key: vcpkg-<os>-qt6-<profile>-<hash(vcpkg.json, admin/cmake/**, CMakeLists.txt)>
  # =========================================================================

  probe-ubuntu-app:
    name: "Probe: ubuntu-24.04 / qt6 / APP"
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-ubuntu-hpc:
    name: "Probe: ubuntu-24.04 / qt6 / HPC"
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-ubuntu-24.04-qt6-HPC-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-macos-arm:
    name: "Probe: macos-15 / qt6 / APP"
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: macos-15
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-macos-15-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-macos-intel:
    name: "Probe: macos-15-intel / qt6 / APP"
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: macos-15-intel
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-macos-15-intel-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-rocky8-app:
    name: "Probe: rocky8 / qt6 / APP"
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-rocky8-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-rocky8-hpc:
    name: "Probe: rocky8 / qt6 / HPC"
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-rocky8-qt6-HPC-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  # =========================================================================
  # PHASE 2 — CONDITIONAL WARM
  # Fires only when has_changes is true AND at least one probe missed.
  # Gating on has_changes prevents the skipped-probe empty-output false-positive
  # where '' != 'true' evaluates true for all six conditions.
  # =========================================================================

  warm-if-needed:
    name: "Warm caches (if any miss)"
    needs:
      - check-changes
      - probe-ubuntu-app
      - probe-ubuntu-hpc
      - probe-macos-arm
      - probe-macos-intel
      - probe-rocky8-app
      - probe-rocky8-hpc
    if: |
      needs.check-changes.outputs.has_changes == 'true' && (
        needs.probe-ubuntu-app.outputs.cache-hit   != 'true' ||
        needs.probe-ubuntu-hpc.outputs.cache-hit   != 'true' ||
        needs.probe-macos-arm.outputs.cache-hit    != 'true' ||
        needs.probe-macos-intel.outputs.cache-hit  != 'true' ||
        needs.probe-rocky8-app.outputs.cache-hit   != 'true' ||
        needs.probe-rocky8-hpc.outputs.cache-hit   != 'true'
      )
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-warm-cache.yml@main
    with:
      ref:        main
      platforms:  all
      qt_variant: qt6
    secrets: inherit

  # =========================================================================
  # PHASE 3 — BUILDS
  # Gated on has_changes so they don't run when warm-if-needed was skipped
  # due to no changes (skipped jobs still satisfy !cancelled()).
  # =========================================================================

  macos-arm-app:
    name: "macOS ARM APP (macos-15, qt6)"
    needs:
      - check-changes
      - warm-if-needed
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     main
      runner:                  macos-15
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}-APP-qt6', github.run_id) }}
      artifact_retention_days: 3

  macos-intel-app:
    name: "macOS Intel APP (macos-15-intel, qt6)"
    needs:
      - check-changes
      - warm-if-needed
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     main
      runner:                  macos-15-intel
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}-APP-qt6', github.run_id) }}
      artifact_retention_days: 3

  windows-app:
    name: "Windows x64 APP (windows-2022, qt6)"
    needs:
      - check-changes
      - warm-if-needed
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     main
      runner:                  windows-2022
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}-APP-qt6', github.run_id) }}
      artifact_retention_days: 3

  ubuntu-app:
    name: "Linux x64 APP (ubuntu-24.04, qt6)"
    needs:
      - check-changes
      - warm-if-needed
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     main
      runner:                  ubuntu-24.04
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}-APP-qt6', github.run_id) }}
      artifact_retention_days: 3

  ubuntu-hpc:
    name: "Linux x64 HPC (ubuntu-24.04, qt6)"
    needs:
      - check-changes
      - warm-if-needed
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     main
      runner:                  ubuntu-24.04
      qt_variant:              qt6
      profile:                 HPC
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}-HPC-qt6', github.run_id) }}
      artifact_retention_days: 3

  rocky8-app:
    name: "Rocky Linux 8 x64 APP (qt6)"
    needs:
      - check-changes
      - warm-if-needed
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     main
      runner:                  ubuntu-24.04
      cache_os_label:          rocky8
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}-APP-qt6', github.run_id) }}
      artifact_retention_days: 3

  rocky8-hpc:
    name: "Rocky Linux 8 x64 HPC (qt6)"
    needs:
      - check-changes
      - warm-if-needed
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     main
      runner:                  ubuntu-24.04
      cache_os_label:          rocky8
      qt_variant:              qt6
      profile:                 HPC
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}-HPC-qt6', github.run_id) }}
      artifact_retention_days: 3

  # =========================================================================
  # PHASE 4 — PUBLISH RELEASE
  # Runs only when all builds succeed. Downloads all run artifacts, renames
  # each to a stable filename, then publishes/overwrites the rolling `nightly`
  # GitHub Release. The release assets are the canonical distribution —
  # artifact retention stays at 3 days.
  # =========================================================================

  publish-release:
    name: "Publish nightly release"
    needs:
      - macos-arm-app
      - macos-intel-app
      - windows-app
      - ubuntu-app
      - ubuntu-hpc
      - rocky8-app
      - rocky8-hpc
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: nightly-*
          path: artifacts
          run-id: ${{ github.run_id }}

      - name: Stage assets with stable filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp_first() {
            local pattern="$1" dest="$2"
            local src
            src=$(find artifacts -path "$pattern" | head -1)
            [ -n "$src" ] || { echo "ERROR: no file matching $pattern"; exit 1; }
            cp "$src" "release-assets/$dest"
            echo "  $dest ← $src"
          }

          echo "Staging release assets..."
          cp_first "artifacts/nightly-*-APP-qt6-macos-15-*/UltraScan3-*-macOS.pkg"         "UltraScan3-APP-macos-arm.pkg"
          cp_first "artifacts/nightly-*-APP-qt6-macos-15-intel-*/UltraScan3-*-macOS.pkg"   "UltraScan3-APP-macos-intel.pkg"
          cp_first "artifacts/nightly-*-APP-qt6-windows-2022-*/UltraScan3-*-Windows.exe"   "UltraScan3-APP-windows-x64.exe"
          cp_first "artifacts/nightly-*-APP-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-APP-linux-x64.tar.gz"
          cp_first "artifacts/nightly-*-HPC-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-HPC-linux-x64.tar.gz"
          cp_first "artifacts/nightly-*-APP-qt6-rocky8-*/UltraScan3-*-Linux-*.tar.gz"      "UltraScan3-APP-rocky8-x64.tar.gz"
          cp_first "artifacts/nightly-*-HPC-qt6-rocky8-*/UltraScan3-*-Linux-*.tar.gz"      "UltraScan3-HPC-rocky8-x64.tar.gz"

          echo "Assets ready:"
          ls -lh release-assets/

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="nightly"
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          NOTES="## UltraScan3 Nightly Build

          **Date:** $DATE
          **Commit:** $COMMIT

          Automated nightly build from \`main\`. All platforms passed.

          | Asset | Platform | Profile |
          |-------|----------|---------|
          | \`UltraScan3-APP-macos-arm.pkg\`    | macOS ARM (Apple Silicon) | Desktop |
          | \`UltraScan3-APP-macos-intel.pkg\`  | macOS Intel (x86-64)      | Desktop |
          | \`UltraScan3-APP-windows-x64.exe\`  | Windows x64               | Desktop |
          | \`UltraScan3-APP-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | Desktop |
          | \`UltraScan3-HPC-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | HPC/MPI |
          | \`UltraScan3-APP-rocky8-x64.tar.gz\`| Rocky Linux 8 x64         | Desktop |
          | \`UltraScan3-HPC-rocky8-x64.tar.gz\`| Rocky Linux 8 x64         | HPC/MPI |"

          # Delete existing nightly release and tag if present
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          sleep 2

          # Create new release with all assets
          gh release create "$TAG" release-assets/* \
            --title "Nightly Build" \
            --notes "$NOTES" \
            --prerelease \
            --target main
