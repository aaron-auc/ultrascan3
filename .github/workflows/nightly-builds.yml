name: UltraScan3 Nightly Build

run-name: >-
  ${{ github.event_name == 'schedule'
    && format('Nightly [main] {0}', github.run_started_at)
    || format('Nightly [manual] by @{0}', github.actor) }}

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:

  # =========================================================================
  # PLATFORM BUILDS — two parallel groups to reduce wall time while keeping
  # peak cache usage under the 10 GB Actions quota.
  #
  # Each platform workflow owns its own probe → warm → build chain using
  # isolated key namespaces (vcpkg-ubuntu-24.04-*, vcpkg-macos-15-*, etc.),
  # so parallel runs do not contend on cache keys.
  #
  # Group 1 (parallel): ubuntu + macos-arm
  #   Combined final keys ~3.9 GB; ubuntu intermediates are small.
  #   Peak well within quota while both warm pipelines overlap.
  #
  # Group 2 (parallel, after group 1): rocky8 + macos-intel
  #   Group 1 intermediates are cleaned up before group 2 starts.
  #   rocky8 is small; intel final key ~1 GB.
  #
  # Group 3 (after group 2): windows
  # =========================================================================

  # --- Group 1 (parallel) ---------------------------------------------------

  ubuntu:
    name: "Ubuntu 24.04 (APP + HPC)"
    uses: ./.github/workflows/nightly-ubuntu.yml
    with:
      ref:                     main
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}', github.run_id) }}
      artifact_retention_days: 3
    secrets: inherit

  macos-arm:
    name: "macOS ARM (APP)"
    uses: ./.github/workflows/nightly-macos-arm.yml
    with:
      ref:                     main
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}', github.run_id) }}
      artifact_retention_days: 3
    secrets: inherit

  # --- Group 2 (parallel, after group 1) ------------------------------------

  rocky8:
    name: "Rocky Linux 8 x64 (APP + HPC)"
    needs: [ubuntu, macos-arm]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/nightly-rocky8.yml
    with:
      ref:                     main
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}', github.run_id) }}
      artifact_retention_days: 3
    secrets: inherit

  macos-intel:
    name: "macOS Intel (APP)"
    needs: [ubuntu, macos-arm]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/nightly-macos-intel.yml
    with:
      ref:                     main
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}', github.run_id) }}
      artifact_retention_days: 3
    secrets: inherit

  # --- Group 3 (after group 2) -----------------------------------------------

  windows:
    name: "Windows x64 (APP)"
    needs: [rocky8, macos-intel]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/nightly-windows.yml
    with:
      ref:                     main
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('nightly-{0}', github.run_id) }}
      artifact_retention_days: 3
    secrets: inherit

  # =========================================================================
  # PHASE 4 — PUBLISH RELEASE
  # Runs only when all builds succeed. Downloads all run artifacts, renames
  # each to a stable filename, then publishes/overwrites the rolling `nightly`
  # GitHub Release. The release assets are the canonical distribution —
  # artifact retention stays at 3 days.
  # =========================================================================

  publish-release:
    name: "Publish nightly release"
    needs:
      - ubuntu
      - rocky8
      - macos-arm
      - macos-intel
      - windows
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: nightly-*
          path: artifacts
          run-id: ${{ github.run_id }}

      - name: Stage assets with stable filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp_first() {
            local pattern="$1" dest="$2"
            local src
            src=$(find artifacts -path "$pattern" | head -1)
            [ -n "$src" ] || { echo "ERROR: no file matching $pattern"; exit 1; }
            cp "$src" "release-assets/$dest"
            echo "  $dest ← $src"
          }

          echo "Staging release assets..."
          cp_first "artifacts/nightly-*-APP-qt6-macos-15-*/UltraScan3-*-macOS.pkg"         "UltraScan3-APP-macos-arm.pkg"
          cp_first "artifacts/nightly-*-APP-qt6-macos-15-intel-*/UltraScan3-*-macOS.pkg"   "UltraScan3-APP-macos-intel.pkg"
          cp_first "artifacts/nightly-*-APP-qt6-windows-2022-*/UltraScan3-*-Windows.exe"   "UltraScan3-APP-windows-x64.exe"
          cp_first "artifacts/nightly-*-APP-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-APP-linux-x64.tar.gz"
          cp_first "artifacts/nightly-*-HPC-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-HPC-linux-x64.tar.gz"
          cp_first "artifacts/nightly-*-APP-qt6-rocky8-*/UltraScan3-*-Linux-*.tar.gz"      "UltraScan3-APP-rocky8-x64.tar.gz"
          cp_first "artifacts/nightly-*-HPC-qt6-rocky8-*/UltraScan3-*-Linux-*.tar.gz"      "UltraScan3-HPC-rocky8-x64.tar.gz"

          echo "Assets ready:"
          ls -lh release-assets/

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="nightly"
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          NOTES="## UltraScan3 Nightly Build

          **Date:** $DATE
          **Commit:** $COMMIT

          Automated nightly build from \`main\`. All platforms passed.

          | Asset | Platform | Profile |
          |-------|----------|---------|
          | \`UltraScan3-APP-macos-arm.pkg\`    | macOS ARM (Apple Silicon) | Desktop |
          | \`UltraScan3-APP-macos-intel.pkg\`  | macOS Intel (x86-64)      | Desktop |
          | \`UltraScan3-APP-windows-x64.exe\`  | Windows x64               | Desktop |
          | \`UltraScan3-APP-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | Desktop |
          | \`UltraScan3-HPC-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | HPC/MPI |
          | \`UltraScan3-APP-rocky8-x64.tar.gz\`| Rocky Linux 8 x64         | Desktop |
          | \`UltraScan3-HPC-rocky8-x64.tar.gz\`| Rocky Linux 8 x64         | HPC/MPI |"

          # Delete existing nightly release and tag if present
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          sleep 2

          # Create new release with all assets
          gh release create "$TAG" release-assets/* \
            --title "Nightly Build" \
            --notes "$NOTES" \
            --prerelease \
            --target main
