name: Nightly — macOS ARM

# ============================================================================
# Platform: macOS 15 arm64 (Apple Silicon)
# Profiles:  APP
# Schedule:  nightly (selected platform)
# Release:   called by release.yml via workflow_call
# Manual:    workflow_dispatch on this file
# ============================================================================
#
# Cache isolation strategy:
#   Probe + warm are scoped to macos-15 keys only.
#   A miss here does NOT trigger warming on any other platform.

run-name: >-
  ${{ github.event_name == 'schedule'
    && format('Nightly macOS ARM [{0}]', github.run_started_at)
    || github.event_name == 'workflow_call'
    && format('Release macOS ARM [{0}]', inputs.ref)
    || format('Manual macOS ARM by @{0}', github.actor) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA"
        required: false
        default: main
        type: string
      clean_tier:
        description: "Clean tier"
        required: false
        default: incremental
        type: choice
        options: [incremental, rebuild, clean, clean-purge-cache]
      artifact_retention_days:
        description: "Artifact retention (days)"
        required: false
        default: "3"
        type: choice
        options: ["3","7","14","30"]

  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or SHA"
        required: false
        type: string
        default: main
      clean_tier:
        required: false
        type: string
        default: incremental
      artifact_name_prefix:
        required: false
        type: string
        default: ""
      artifact_retention_days:
        required: false
        type: number
        default: 3

permissions:
  contents: write
  actions: write

jobs:

  # --------------------------------------------------------------------------
  # PHASE 0 — CHANGE DETECTION
  # --------------------------------------------------------------------------
  check-changes:
    name: "Check for changes in last 24h"
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git log --oneline --since="24 hours ago" origin/main | wc -l | tr -d ' ')
          echo "Commits in last 24h: $COUNT"
          echo "has_changes=$( [[ $COUNT -gt 0 ]] && echo true || echo false )" >> "$GITHUB_OUTPUT"

  # --------------------------------------------------------------------------
  # PHASE 1 — CACHE PROBE
  # --------------------------------------------------------------------------
  probe-app:
    name: "Probe: macos-15 / qt6 / APP"
    needs: check-changes
    if: needs.check-changes.outputs.has_changes == 'true'
    runs-on: macos-15
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/us3-vcpkg-cache
          key: vcpkg-macos-15-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'buildsys/vcpkg/overlay-ports/**', 'scripts/warm-cache.sh') }}
          lookup-only: true

  # --------------------------------------------------------------------------
  # PHASE 2 — CONDITIONAL WARM
  # --------------------------------------------------------------------------
  warm-if-needed:
    name: "Warm macos-15 cache (if miss)"
    needs: [check-changes, probe-app]
    if: |
      needs.check-changes.outputs.has_changes == 'true' &&
      needs.probe-app.outputs.cache-hit != 'true'
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-warm-cache.yml@main
    with:
      ref:        ${{ inputs.ref || 'main' }}
      platforms:  "macos-arm (macos-15)"
      qt_variant: qt6
    secrets: inherit

  # --------------------------------------------------------------------------
  # PHASE 3 — BUILD
  # --------------------------------------------------------------------------
  build-app:
    name: "macOS ARM APP (macos-15, qt6)"
    needs: [check-changes, warm-if-needed]
    if: ${{ !cancelled() && needs.check-changes.outputs.has_changes == 'true' }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ inputs.ref || 'main' }}
      runner:                  macos-15
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              ${{ inputs.clean_tier || 'incremental' }}
      artifact_name_prefix:    ${{ format('{0}-arm', inputs.artifact_name_prefix || format('nightly-{0}', github.run_id)) }}
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days || '3') }}
