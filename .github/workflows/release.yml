name: UltraScan3 Release

run-name: "Release ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  # =========================================================================
  # PHASE 1 — CACHE PROBES
  # Exact-key lookup for each platform/profile. A miss triggers Phase 2.
  # Tags are always cut from main so ref is github.ref (the tag), which
  # resolves to the tagged main commit.
  # =========================================================================

  probe-ubuntu-app:
    name: "Probe: ubuntu-24.04 / qt6 / APP"
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-ubuntu-hpc:
    name: "Probe: ubuntu-24.04 / qt6 / HPC"
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-ubuntu-24.04-qt6-HPC-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-macos-arm:
    name: "Probe: macos-15 / qt6 / APP"
    runs-on: macos-15
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-macos-intel:
    name: "Probe: macos-15-intel / qt6 / APP"
    runs-on: macos-15-intel
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-macos-15-intel-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-rocky8-app:
    name: "Probe: rocky8 / qt6 / APP"
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-rocky8-qt6-APP-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  probe-rocky8-hpc:
    name: "Probe: rocky8 / qt6 / HPC"
    runs-on: ubuntu-24.04
    outputs:
      cache-hit: ${{ steps.probe.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - id: probe
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ runner.temp }}/us3-vcpkg-cache
            ${{ runner.temp }}/us3-vcpkg-downloads
          key: vcpkg-rocky8-qt6-HPC-${{ hashFiles('vcpkg.json', 'admin/cmake/**', 'CMakeLists.txt') }}
          lookup-only: true

  # =========================================================================
  # PHASE 2 — CONDITIONAL WARM
  # =========================================================================

  warm-if-needed:
    name: "Warm caches (if any miss)"
    needs:
      - probe-ubuntu-app
      - probe-ubuntu-hpc
      - probe-macos-arm
      - probe-macos-intel
      - probe-rocky8-app
      - probe-rocky8-hpc
    if: |
      needs.probe-ubuntu-app.outputs.cache-hit   != 'true' ||
      needs.probe-ubuntu-hpc.outputs.cache-hit   != 'true' ||
      needs.probe-macos-arm.outputs.cache-hit    != 'true' ||
      needs.probe-macos-intel.outputs.cache-hit  != 'true' ||
      needs.probe-rocky8-app.outputs.cache-hit   != 'true' ||
      needs.probe-rocky8-hpc.outputs.cache-hit   != 'true'
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-warm-cache.yml@main
    with:
      ref:        ${{ github.ref }}
      platforms:  all
      qt_variant: qt6
    secrets: inherit

  # =========================================================================
  # PHASE 3 — BUILDS
  # =========================================================================

  macos-arm-app:
    name: "macOS ARM APP (macos-15, qt6)"
    needs: warm-if-needed
    if: ${{ !cancelled() }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ github.ref }}
      runner:                  macos-15
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}-APP-qt6', github.ref_name) }}
      artifact_retention_days: 3

  macos-intel-app:
    name: "macOS Intel APP (macos-15-intel, qt6)"
    needs: warm-if-needed
    if: ${{ !cancelled() }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ github.ref }}
      runner:                  macos-15-intel
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}-APP-qt6', github.ref_name) }}
      artifact_retention_days: 3

  windows-app:
    name: "Windows x64 APP (windows-2022, qt6)"
    needs: warm-if-needed
    if: ${{ !cancelled() }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ github.ref }}
      runner:                  windows-2022
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}-APP-qt6', github.ref_name) }}
      artifact_retention_days: 3

  ubuntu-app:
    name: "Linux x64 APP (ubuntu-24.04, qt6)"
    needs: warm-if-needed
    if: ${{ !cancelled() }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ github.ref }}
      runner:                  ubuntu-24.04
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}-APP-qt6', github.ref_name) }}
      artifact_retention_days: 3

  ubuntu-hpc:
    name: "Linux x64 HPC (ubuntu-24.04, qt6)"
    needs: warm-if-needed
    if: ${{ !cancelled() }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ github.ref }}
      runner:                  ubuntu-24.04
      qt_variant:              qt6
      profile:                 HPC
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}-HPC-qt6', github.ref_name) }}
      artifact_retention_days: 3

  rocky8-app:
    name: "Rocky Linux 8 x64 APP (qt6)"
    needs: warm-if-needed
    if: ${{ !cancelled() }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ github.ref }}
      runner:                  ubuntu-24.04
      cache_os_label:          rocky8
      qt_variant:              qt6
      profile:                 APP
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}-APP-qt6', github.ref_name) }}
      artifact_retention_days: 3

  rocky8-hpc:
    name: "Rocky Linux 8 x64 HPC (qt6)"
    needs: warm-if-needed
    if: ${{ !cancelled() }}
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@main
    with:
      ref:                     ${{ github.ref }}
      runner:                  ubuntu-24.04
      cache_os_label:          rocky8
      qt_variant:              qt6
      profile:                 HPC
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}-HPC-qt6', github.ref_name) }}
      artifact_retention_days: 3

  # =========================================================================
  # PHASE 4 — PUBLISH RELEASE
  # Creates a permanent versioned GitHub Release tagged v*.
  # =========================================================================

  publish-release:
    name: "Publish release ${{ github.ref_name }}"
    needs:
      - macos-arm-app
      - macos-intel-app
      - windows-app
      - ubuntu-app
      - ubuntu-hpc
      - rocky8-app
      - rocky8-hpc
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-${{ github.ref_name }}-*
          path: artifacts
          run-id: ${{ github.run_id }}

      - name: Stage assets with stable filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp_first() {
            local pattern="$1" dest="$2"
            local src
            src=$(find artifacts -path "$pattern" | head -1)
            [ -n "$src" ] || { echo "ERROR: no file matching $pattern"; exit 1; }
            cp "$src" "release-assets/$dest"
            echo "  $dest ← $src"
          }

          echo "Staging release assets..."
          cp_first "artifacts/release-*-APP-qt6-macos-15-*/UltraScan3-*-macOS.pkg"          "UltraScan3-APP-macos-arm.pkg"
          cp_first "artifacts/release-*-APP-qt6-macos-15-intel-*/UltraScan3-*-macOS.pkg"    "UltraScan3-APP-macos-intel.pkg"
          cp_first "artifacts/release-*-APP-qt6-windows-2022-*/UltraScan3-*-Windows.exe"    "UltraScan3-APP-windows-x64.exe"
          cp_first "artifacts/release-*-APP-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-APP-linux-x64.tar.gz"
          cp_first "artifacts/release-*-HPC-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-HPC-linux-x64.tar.gz"
          cp_first "artifacts/release-*-APP-qt6-rocky8-*/UltraScan3-*-Linux-*.tar.gz"       "UltraScan3-APP-rocky8-x64.tar.gz"
          cp_first "artifacts/release-*-HPC-qt6-rocky8-*/UltraScan3-*-Linux-*.tar.gz"       "UltraScan3-HPC-rocky8-x64.tar.gz"

          echo "Assets ready:"
          ls -lh release-assets/

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          NOTES="## UltraScan3 $TAG

          **Released:** $DATE
          **Commit:** $COMMIT

          | Asset | Platform | Profile |
          |-------|----------|---------|
          | \`UltraScan3-APP-macos-arm.pkg\`    | macOS ARM (Apple Silicon) | Desktop |
          | \`UltraScan3-APP-macos-intel.pkg\`  | macOS Intel (x86-64)      | Desktop |
          | \`UltraScan3-APP-windows-x64.exe\`  | Windows x64               | Desktop |
          | \`UltraScan3-APP-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | Desktop |
          | \`UltraScan3-HPC-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | HPC/MPI |
          | \`UltraScan3-APP-rocky8-x64.tar.gz\`| Rocky Linux 8 x64         | Desktop |
          | \`UltraScan3-HPC-rocky8-x64.tar.gz\`| Rocky Linux 8 x64         | HPC/MPI |"

          gh release create "$TAG" release-assets/* \
            --title "UltraScan3 $TAG" \
            --notes "$NOTES" \
            --target main
