name: UltraScan3 Release

# ============================================================================
# Triggered by a v* tag push.
# Calls each of the 5 platform workflows via workflow_call, then publishes
# a versioned GitHub Release with all platform assets.
#
# Platform workflows perform their own probe + warm + build internally.
# This workflow just fans out, collects artifacts, and publishes.
# ============================================================================

run-name: "Release ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:

  # --------------------------------------------------------------------------
  # PLATFORM BUILDS (all 5 platforms, in parallel)
  # Each platform workflow runs its own probe → warm → build chain.
  # --------------------------------------------------------------------------

  ubuntu:
    name: "Ubuntu 24.04 (APP + HPC)"
    uses: ./.github/workflows/nightly-ubuntu.yml
    with:
      ref:                     ${{ github.ref }}
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}', github.ref_name) }}
      artifact_retention_days: 7
    secrets: inherit

  macos-arm:
    name: "macOS ARM (APP)"
    uses: ./.github/workflows/nightly-macos-arm.yml
    with:
      ref:                     ${{ github.ref }}
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}', github.ref_name) }}
      artifact_retention_days: 7
    secrets: inherit

  macos-intel:
    name: "macOS Intel (APP)"
    uses: ./.github/workflows/nightly-macos-intel.yml
    with:
      ref:                     ${{ github.ref }}
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}', github.ref_name) }}
      artifact_retention_days: 7
    secrets: inherit

  windows:
    name: "Windows x64 (APP)"
    uses: ./.github/workflows/nightly-windows.yml
    with:
      ref:                     ${{ github.ref }}
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}', github.ref_name) }}
      artifact_retention_days: 7
    secrets: inherit

  rocky8:
    name: "Oracle Linux 8 x64 (APP + HPC)"
    uses: ./.github/workflows/nightly-oraclelinux8.yml
    with:
      ref:                     ${{ github.ref }}
      clean_tier:              incremental
      artifact_name_prefix:    ${{ format('release-{0}', github.ref_name) }}
      artifact_retention_days: 7
    secrets: inherit

  # --------------------------------------------------------------------------
  # PUBLISH RELEASE
  # Runs only when all platform builds succeeded.
  # Downloads all artifacts produced by this run, renames to stable filenames,
  # then creates a permanent versioned GitHub Release.
  # --------------------------------------------------------------------------
  publish-release:
    name: "Publish release ${{ github.ref_name }}"
    needs: [ubuntu, macos-arm, macos-intel, windows, rocky8]
    if: success()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Download all build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: release-${{ github.ref_name }}-*
          path: artifacts
          run-id: ${{ github.run_id }}

      - name: Stage assets with stable filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          cp_first() {
            local pattern="$1" dest="$2"
            local src
            src=$(find artifacts -path "$pattern" | head -1)
            [ -n "$src" ] || { echo "ERROR: no file matching $pattern"; exit 1; }
            cp "$src" "release-assets/$dest"
            echo "  $dest ← $src"
          }

          echo "Staging release assets..."
          cp_first "artifacts/release-*-APP-qt6-macos-15-*/UltraScan3-*-macOS.pkg"          "UltraScan3-APP-macos-arm.pkg"
          cp_first "artifacts/release-*-APP-qt6-macos-15-intel-*/UltraScan3-*-macOS.pkg"    "UltraScan3-APP-macos-intel.pkg"
          cp_first "artifacts/release-*-APP-qt6-windows-2022-*/UltraScan3-*-Windows.exe"    "UltraScan3-APP-windows-x64.exe"
          cp_first "artifacts/release-*-APP-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-APP-linux-x64.tar.gz"
          cp_first "artifacts/release-*-HPC-qt6-ubuntu-24.04-*/UltraScan3-*-Linux-*.tar.gz" "UltraScan3-HPC-linux-x64.tar.gz"
          cp_first "artifacts/release-*-APP-qt6-oraclelinux8-*/UltraScan3-*-Linux-*.tar.gz"  "UltraScan3-APP-oraclelinux8-x64.tar.gz"
          cp_first "artifacts/release-*-HPC-qt6-oraclelinux8-*/UltraScan3-*-Linux-*.tar.gz"  "UltraScan3-HPC-oraclelinux8-x64.tar.gz"

          echo "Assets ready:"
          ls -lh release-assets/

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ github.ref_name }}"
          COMMIT=$(git rev-parse HEAD)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          NOTES="## UltraScan3 $TAG

          **Released:** $DATE
          **Commit:** $COMMIT

          | Asset | Platform | Profile |
          |-------|----------|---------|
          | \`UltraScan3-APP-macos-arm.pkg\`    | macOS ARM (Apple Silicon) | Desktop |
          | \`UltraScan3-APP-macos-intel.pkg\`  | macOS Intel (x86-64)      | Desktop |
          | \`UltraScan3-APP-windows-x64.exe\`  | Windows x64               | Desktop |
          | \`UltraScan3-APP-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | Desktop |
          | \`UltraScan3-HPC-linux-x64.tar.gz\` | Ubuntu 24.04 x64          | HPC/MPI |
          | \`UltraScan3-APP-oraclelinux8-x64.tar.gz\`| Oracle Linux 8 x64         | Desktop |
          | \`UltraScan3-HPC-oraclelinux8-x64.tar.gz\`| Oracle Linux 8 x64         | HPC/MPI |"

          gh release create "$TAG" release-assets/* \
            --title "UltraScan3 $TAG" \
            --notes "$NOTES" \
            --target main
