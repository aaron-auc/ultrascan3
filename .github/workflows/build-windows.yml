name: Build — Windows

run-name: >-
  ${{ github.event_name == 'workflow_call'
    && format('Windows [{0}]', inputs.ref)
    || format('Manual Windows by @{0}', github.actor) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA"
        required: false
        default: main
        type: string
      clean_tier:
        description: "Clean tier"
        required: false
        default: incremental
        type: choice
        options: [incremental, rebuild, clean, clean-purge-cache]
      artifact_retention_days:
        description: "Artifact retention (days)"
        required: false
        default: "3"
        type: choice
        options: ["3", "7", "14", "30"]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: main
      clean_tier:
        required: false
        type: string
        default: incremental
      artifact_name_prefix:
        required: false
        type: string
        default: ""
      artifact_retention_days:
        required: false
        type: number
        default: 3

permissions:
  contents: read
  actions: write

concurrency:
  group: ultrascan3-cache-windows-x64-qt6
  cancel-in-progress: false

jobs:
  warm-partition-a:
    name: "Warm Windows cache A (stages 1-3)"
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Define cache keys
        id: cache-keys
        shell: bash
        env:
          FINGERPRINT: ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'buildsys/vcpkg/overlay-ports/**', 'admin/cmake/triplets/**', 'admin/cmake/toolchain.cmake', 'scripts/warm-cache.sh', 'scripts/warm-cache-windows.ps1') }}
        run: |
          {
            echo "partition-a=vcpkg-windows-x64-qt6-APP-a-${FINGERPRINT}"
            echo "partition-b=vcpkg-windows-x64-qt6-APP-b-${FINGERPRINT}"
          } >> "$GITHUB_OUTPUT"

      - name: Delete requested Windows cache partitions
        if: inputs.clean_tier == 'clean-purge-cache'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_A: ${{ steps.cache-keys.outputs.partition-a }}
          CACHE_B: ${{ steps.cache-keys.outputs.partition-b }}
        run: |
          gh cache delete "$CACHE_A" --repo "$GITHUB_REPOSITORY" || true
          gh cache delete "$CACHE_B" --repo "$GITHUB_REPOSITORY" || true

      - name: Restore Windows cache partition A
        id: cache-a
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\us3-vcpkg-cache-a
          key: ${{ steps.cache-keys.outputs.partition-a }}
          restore-keys: ${{ inputs.clean_tier == 'clean-purge-cache' && '' || 'vcpkg-windows-x64-qt6-APP-a-' }}

      - name: Warm base dependencies
        if: steps.cache-a.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}\us3-vcpkg-cache-a
        run: scripts\warm-cache-windows.ps1 -Stage 1

      - name: Warm qtbase
        if: steps.cache-a.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}\us3-vcpkg-cache-a
        run: scripts\warm-cache-windows.ps1 -Stage 2

      - name: Warm qtmultimedia and qtdeclarative
        if: steps.cache-a.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}\us3-vcpkg-cache-a
        run: scripts\warm-cache-windows.ps1 -Stage 3

      - name: Save Windows cache partition A
        if: success() && steps.cache-a.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\us3-vcpkg-cache-a
          key: ${{ steps.cache-keys.outputs.partition-a }}

  warm-partition-b:
    name: "Warm Windows cache B (stages 4-5)"
    needs: warm-partition-a
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 1

      - name: Define cache keys
        id: cache-keys
        shell: bash
        env:
          FINGERPRINT: ${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'buildsys/vcpkg/overlay-ports/**', 'admin/cmake/triplets/**', 'admin/cmake/toolchain.cmake', 'scripts/warm-cache.sh', 'scripts/warm-cache-windows.ps1') }}
        run: |
          {
            echo "partition-a=vcpkg-windows-x64-qt6-APP-a-${FINGERPRINT}"
            echo "partition-b=vcpkg-windows-x64-qt6-APP-b-${FINGERPRINT}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Windows cache partition B
        id: cache-b
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\us3-vcpkg-cache-b
          key: ${{ steps.cache-keys.outputs.partition-b }}
          restore-keys: ${{ inputs.clean_tier == 'clean-purge-cache' && '' || 'vcpkg-windows-x64-qt6-APP-b-' }}

      - name: Restore required Windows cache partition A
        if: steps.cache-b.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\us3-vcpkg-cache-a
          key: ${{ steps.cache-keys.outputs.partition-a }}
          fail-on-cache-miss: true

      - name: Warm remaining Qt and database libraries
        if: steps.cache-b.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}\us3-vcpkg-cache-b
          VCPKG_BINARY_SOURCES: 'clear;files,${{ runner.temp }}\us3-vcpkg-cache-a,read;files,${{ runner.temp }}\us3-vcpkg-cache-b,readwrite'
        run: scripts\warm-cache-windows.ps1 -Stage 4

      - name: Warm Qwt dependencies
        if: steps.cache-b.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CI: "true"
          US3_VCPKG_CACHE: ${{ runner.temp }}\us3-vcpkg-cache-b
          VCPKG_BINARY_SOURCES: 'clear;files,${{ runner.temp }}\us3-vcpkg-cache-a,read;files,${{ runner.temp }}\us3-vcpkg-cache-b,readwrite'
        run: scripts\warm-cache-windows.ps1 -Stage 5

      - name: Save Windows cache partition B
        if: success() && steps.cache-b.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\us3-vcpkg-cache-b
          key: ${{ steps.cache-keys.outputs.partition-b }}

  build-app:
    name: "Windows APP (x86_64, qt6)"
    needs: warm-partition-b
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@e65fc40ed1d9cba4c61a3e2b5d99e2a96a117905
    with:
      ref: ${{ inputs.ref || 'main' }}
      runner: windows-2022
      qt_variant: qt6
      profile: APP
      clean_tier: ${{ inputs.clean_tier == 'clean-purge-cache' && 'clean' || inputs.clean_tier || 'incremental' }}
      artifact_name_prefix: ${{ inputs.artifact_name_prefix || format('nightly-windows-{0}', github.run_id) }}
      artifact_platform_label: Windows-x86_64
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days || '3') }}
      require_exact_cache_hit: true
      save_cache: false
      windows_split_cache: true
