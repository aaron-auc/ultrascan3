name: UltraScan3 On-Demand Build

# ============================================================================
# Manual dispatch (workflow_dispatch) entry point for on-demand platform builds.
# Fans out to the corresponding build-<platform>.yml reusable workflows. Each
# platform calls the same package build and uses vcpkg's native binary cache.
#
# Inputs: ref (branch/tag/SHA), platforms (single, group, or all), clean tier,
#         artifact retention. Artifact names include the UltraScan version,
#         workflow build number, commit, and platform.
# ============================================================================

run-name: "On-Demand [${{ inputs.ref }}] ${{ inputs.platforms }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:

      ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "main"
        type: string

      platforms:
        description: "Platforms to build"
        required: true
        default: "ubuntu"
        type: choice
        options:
          - all
          - ubuntu
          - macos-arm
          - macos-intel
          - windows
          - oraclelinux8
          - linux          # ubuntu + oraclelinux8
          - macos          # macos-arm + macos-intel

      clean_tier:
        description: "Clean tier"
        required: true
        default: incremental
        type: choice
        options:
          - incremental
          - rebuild
          - clean
          - clean-purge-cache

      artifact_retention_days:
        description: "Artifact retention (days)"
        required: true
        default: "7"
        type: choice
        options: ["3","7","14","30"]

permissions:
  contents: write
  packages: write

jobs:

  metadata:
    name: "Resolve build identity"
    runs-on: ubuntu-24.04
    outputs:
      version:   ${{ steps.identity.outputs.version }}
      short_sha: ${{ steps.identity.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Read version and commit
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "Invalid VERSION value for an artifact name: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

  ubuntu:
    name: "Ubuntu 24.04 (APP + HPC)"
    needs: metadata
    if: |
      inputs.platforms == 'all'    ||
      inputs.platforms == 'ubuntu' ||
      inputs.platforms == 'linux'
    uses: ./.github/workflows/build-ubuntu.yml
    with:
      ref:                     ${{ inputs.ref }}
      clean_tier:              ${{ inputs.clean_tier }}
      artifact_name_prefix:    ${{ format('UltraScan3-{0}-build-{1}-{2}', needs.metadata.outputs.version, github.run_number, needs.metadata.outputs.short_sha) }}
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days) }}
    secrets: inherit

  macos-arm:
    name: "macOS ARM (APP)"
    needs: metadata
    if: |
      inputs.platforms == 'all'       ||
      inputs.platforms == 'macos-arm' ||
      inputs.platforms == 'macos'
    uses: ./.github/workflows/build-macos-arm.yml
    with:
      ref:                     ${{ inputs.ref }}
      clean_tier:              ${{ inputs.clean_tier }}
      artifact_name_prefix:    ${{ format('UltraScan3-{0}-build-{1}-{2}', needs.metadata.outputs.version, github.run_number, needs.metadata.outputs.short_sha) }}
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days) }}
    secrets: inherit

  macos-intel:
    name: "macOS Intel (APP)"
    needs: metadata
    if: |
      inputs.platforms == 'all'         ||
      inputs.platforms == 'macos-intel' ||
      inputs.platforms == 'macos'
    uses: ./.github/workflows/build-macos-intel.yml
    with:
      ref:                     ${{ inputs.ref }}
      clean_tier:              ${{ inputs.clean_tier }}
      artifact_name_prefix:    ${{ format('UltraScan3-{0}-build-{1}-{2}', needs.metadata.outputs.version, github.run_number, needs.metadata.outputs.short_sha) }}
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days) }}
    secrets: inherit

  windows:
    name: "Windows x64 (APP)"
    needs: metadata
    if: |
      inputs.platforms == 'all'     ||
      inputs.platforms == 'windows'
    uses: ./.github/workflows/build-windows.yml
    with:
      ref:                     ${{ inputs.ref }}
      clean_tier:              ${{ inputs.clean_tier }}
      artifact_name_prefix:    ${{ format('UltraScan3-{0}-build-{1}-{2}', needs.metadata.outputs.version, github.run_number, needs.metadata.outputs.short_sha) }}
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days) }}
    secrets: inherit

  oraclelinux8:
    name: "Oracle Linux 8 x64 (APP + HPC)"
    needs: metadata
    if: |
      inputs.platforms == 'all'         ||
      inputs.platforms == 'oraclelinux8' ||
      inputs.platforms == 'linux'
    uses: ./.github/workflows/build-oraclelinux.yml
    with:
      ref:                     ${{ inputs.ref }}
      clean_tier:              ${{ inputs.clean_tier }}
      artifact_name_prefix:    ${{ format('UltraScan3-{0}-build-{1}-{2}', needs.metadata.outputs.version, github.run_number, needs.metadata.outputs.short_sha) }}
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days) }}
    secrets: inherit
