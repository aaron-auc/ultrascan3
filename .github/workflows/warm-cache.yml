name: Warm vcpkg Cache

# Dispatches the staged vcpkg cache-warming workflow in uslims_version_workflows.
# Run this manually before a nightly build, or after vcpkg.json / overlay port
# changes, on any platform that has been hitting disk-space failures.
#
# The warm workflow installs vcpkg dependencies in staged jobs, saving the
# binary cache after each stage so partial progress is never lost.
# Once all stages complete, the full build workflow gets a cache hit and skips
# vcpkg entirely, leaving enough disk headroom for the UltraScan3 compile.

run-name: "Warm Cache [${{ inputs.ref }}] ${{ inputs.platforms }} by @${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:

      ref:
        description: "Branch, tag, or SHA to warm the cache for"
        required: false
        type: string
        default: main

      platforms:
        description: "Platforms to warm"
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "ubuntu-x64 (ubuntu-24.04)"
          - "macos-arm (macos-15)"
          - "macos-intel (macos-15-intel)"
          - "oraclelinux8-x64"

permissions:
  contents: read
  actions: write

jobs:
  warm:
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-warm-cache.yml@main
    with:
      ref:        ${{ inputs.ref }}
      platforms:  ${{ inputs.platforms }}
      qt_variant: qt6
    secrets: inherit
