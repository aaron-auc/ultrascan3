name: Build — macOS Intel

run-name: >-
  ${{ github.event_name == 'workflow_call'
    && format('macOS Intel [{0}]', inputs.ref)
    || format('Manual macOS Intel by @{0}', github.actor) }}

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA"
        required: false
        default: main
        type: string
      clean_tier:
        description: "Clean tier"
        required: false
        default: incremental
        type: choice
        options: [incremental, rebuild, clean, clean-purge-cache]
      artifact_retention_days:
        description: "Artifact retention (days)"
        required: false
        default: "3"
        type: choice
        options: ["3", "7", "14", "30"]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: main
      clean_tier:
        required: false
        type: string
        default: incremental
      artifact_name_prefix:
        required: false
        type: string
        default: ""
      artifact_retention_days:
        required: false
        type: number
        default: 3

permissions:
  contents: read
  actions: write

jobs:
  build-app:
    name: "macOS APP (x86_64, qt6)"
    uses: ehb54/uslims_version_workflows/.github/workflows/ultrascan-reusable-build.yml@46b2059634e499b48535ddf6143eddf6fc7c7b08
    with:
      ref: ${{ inputs.ref || 'main' }}
      runner: macos-15-intel
      qt_variant: qt6
      profile: APP
      vcpkg_build_jobs: 1
      clean_tier: ${{ inputs.clean_tier || 'incremental' }}
      artifact_name_prefix: ${{ inputs.artifact_name_prefix || format('nightly-macos-intel-{0}', github.run_id) }}
      artifact_platform_label: macOS-x86_64
      artifact_retention_days: ${{ fromJson(inputs.artifact_retention_days || '3') }}
